<!doctype html>
<html>
<head>
<title>javascript</title>
</head>
<body>
<button onclick="changeColor()">Change color</button>
<script>
	let color=['blue','yellow','pink','green'];
	let i=0;
	function changeColor()
	{
		document.body.style.backgroundColor=color[i]
		i++;
	}
	if(i==color.length)
	{
		i=0;
	}
</script>
</body>
</html>
