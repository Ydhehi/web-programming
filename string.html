<!doctype html>
<html>
<head>
<title> javascript </title>
</head>
<body bgcolor="lavender">
<h1><center><b><i>STRING AND MATHS FUNCTIONS</h1></center></b></i>
<script>
var a="good morning";
var b="helloo!";
var c="how are you";
document.write("string 1=" + a +"<br><br>");
document.write("string 2=" + b +"<br><br>");
document.write("string 3=" + c +"<br><br>");
document.write("<h2><I>STRING FUNCTIONS</I></h2>");
document.write("CONCATENATION=" + b + a + "<br><br>");
document.write(a.toUpperCase() + "<br><br>");
document.write(b.toUpperCase() + "<br><br>");
document.write(c.toUpperCase() + "<br><br>");
document.write(a.toLowerCase() + "<br><br>");
document.write(b.toLowerCase() + "<br><br>");
document.write(c.toLowerCase() + "<br><br>");
document.write(a.replace("good morning","hii"));
document.write("<h2><I>MATHS  FUNCTIONS</I></h2>");
var x=25;
var y=4;
document.write("square root= " + Math.sqrt(x) + "<br><br>");
document.write("square root= " + Math.sqrt(y) + "<br><br>");
document.write("power= " + Math.pow(x,2) + "<br><br>");
document.write("power= " + Math.pow(y,2) + "<br><br>");
document.write("absolute= " + Math.abs(-10) + "<br><br>");
document.write("round= " + Math.round(4.6) + "<br><br>");
document.write("maximum= " + Math.max(x,y) + "<br><br>");
document.write("minimum= " + Math.min(x,y) + "<br><br>");
</script>
</body>
