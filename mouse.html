
<!DOCTYPE html>
<html>
<head>
    <title>Mouse Over</title>
</head>
<body>

    <h2>Move the mouse over the image</h2>

    <div onmouseover="newContent()" onmouseout="changeContent()">

        <img id="image"
             src="cat2.jpg"
             width="200"
             height="100">

        <h3 id="text">This is the original image</h3>

    </div>

    <script>
        function newContent()
        {
            document.getElementById("image").src = "cat1.jpg";
            document.getElementById("text").innerHTML =
                "This is the new image";
        }

        function changeContent()
        {
            document.getElementById("image").src = "cat2.jpg";
            document.getElementById("text").innerHTML =
                "This is the original image";
        }
    </script>

</body>
</html>
